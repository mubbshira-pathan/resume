
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills Page</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
        }

        .header {
            width: 100%;
            min-height: 100vh;
            background-color: rgb(244, 244, 161);
            background-image: url("mb (1) (1).png");
            background-repeat: no-repeat;
            background-size: cover;
            padding: 20px;
            position: relative;
        }

        .header h1 {
            text-align: center;
            margin-bottom: 40px;
            text-decoration: underline;
        }

        .skills-container {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
        }

        .hard,
        .soft {
            background: rgba(255, 255, 255, 0.8);
            padding: 20px;
            border-radius: 10px;
            flex: 1 1 300px;
            max-width: 400px;
            margin: 10px;
        }

        .hard p,
        .soft p {
            color: brown;
            font-size: large;
            font-weight: bold;
            text-shadow: 0px 5px 14px yellow;
            margin-bottom: 5px;
        }

        .hard ul,
        .soft ul {
            list-style: none;
        }

        .hard li,
        .soft li {
            margin: 5px 0;
        }

        .hard img,
        .soft img {
            width: 100px;
            height: 100px;
            border: 2px solid black;
            box-shadow: 0px 4px 15px black;
            display: block;
            margin-bottom: 10px;
        }

        .mm,
        .mmm {
            position: absolute;
            top: 20px;
        }

        .mm {
            left: 20px;
        }

        .mmm {
            right: 20px;
        }

        .mm img,
        .mmm img {
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .skills-container {
                flex-direction: column;
                align-items: center;
            }

            .hard,
            .soft {
                max-width: 90%;
            }

            .header h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>My Skills</h1>

        <div class="skills-container">
            <div class="hard">
                <img src="hard.jfif" alt="Hard Skills">
                <p>Programming Languages</p>
                <ul>
                    <li>Java</li>
                    <li>C</li>
                    <li>C++</li>
                    <li>Python</li>
                </ul>
                <p>Web Development</p>
                <ul>
                    <li>HTML</li>
                    <li>CSS</li>
                </ul>
                <p>Database Management</p>
                <ul>
                    <li>Oracle</li>
                    <li>MySQL</li>
                </ul>
            </div>

            <div class="soft">
                <img src="soft.jfif" alt="Soft Skills">
                <p>Soft Skills</p>
                <ul>
                    <li>Communication Skills</li><Br>
                    <li>Team Work</li><Br>
                    <li>Leadership</li><br>
                    <li>Emotional Intelligence</li><br>
                    <li>Adaptability</li>
                </ul>
            </div>
        </div>

        <div class="mm">
            <a href="index.html"><img src="arr.png" alt="Back" width="30px"></a>
        </div>
        <div class="mmm">
            <a href="aboutme.html"><img src="r.png" alt="Next" width="40px"></a>
        </div>
    </div>
</body>

</html>
