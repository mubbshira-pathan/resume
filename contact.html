
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Contact Page</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
    }

    .header {
        width: 100%;
        min-height: 100vh;
        height: 100vh; /* full viewport height on mobile */
        background-image: url("mb (1) (1).png");
        background-repeat: no-repeat;
        background-size: cover; /* cover entire container */
        background-position: center center; /* center image */
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* Dark overlay for readability */
    .header::before {
        content: "";
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0,0,0,0.5); /* normal overlay */
        z-index: 1;
    }

    .main {
        position: relative;
        z-index: 2;
        background: rgba(255,255,255,0.9);
        padding: 25px 20px;
        border-radius: 10px;
        max-width: 450px;
        width: 90%;
        text-align: center;
    }

    .main h1 {
        color: brown;
        text-shadow: 0px 3px 5px yellow;
        margin-bottom: 20px;
        text-decoration: underline;
        font-size: 28px;
    }

    .phot {
        display: flex;
        flex-direction: column;
        gap: 15px;
        text-align: left;
    }

    .phot-item {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
    }

    .phot-item img {
        width: 30px;
        height: auto;
    }

    .phot-item p,
    .phot-item a {
        font-size: 15px;
        color: black;
        word-break: break-word;
        text-decoration: none;
    }

    .phot-item a:hover {
        text-decoration: underline;
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
        .main {
            max-width: 90%;
            padding: 20px;
        }

        .phot-item img {
            width: 25px;
        }

        .phot-item p,
        .phot-item a {
            font-size: 14px;
        }

        .main h1 {
            font-size: 24px;
        }
    }

    @media (max-width: 480px) {
        .header::before {
            background: rgba(0,0,0,0.3); /* lighter overlay for mobile */
        }

        .main {
            padding: 15px;
        }

        .phot-item img {
            width: 20px;
        }

        .phot-item p,
        .phot-item a {
            font-size: 13px;
        }

        .main h1 {
            font-size: 22px;
        }
    }
</style>
</head>
