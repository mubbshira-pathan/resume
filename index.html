<style>

    * {

    }

    body {
        background: linear-gradient(135deg, #f4f4a1, #fff9e6);

    .nav-links p {

        color: #333;
        margin: 0 10px;
        font-weight: 500;
        padding: 5px 10px;
        border-radius: 5px;
    }

    .nav-links a:hover {
        background-color: rgba(166,124,0,0.2);
        color: #a67c00;
    }

    
    .main {
        text-align: center;
        margin-bottom: 40px;
    }
    #lo{

    }

    .main h1 {

        color: #a67c00;

        text-shadow: 1px 1px 6px #fffbe0;

    .main p {
        font-size: 16px;
        max-width: 500px;
        margin: 0 auto;
        line-height: 1.5;
           position: relative;
      bottom:40px;
        color: #4d3c00;
    }

    .photo {
        margin-top: 20px;
        border-radius: 50%;
        overflow: hidden;
        width: 250px;
            position: relative;
      bottom:60px;
        height: 250px;
        border: 3px solid #fff9e6;
        box-shadow: 0 2px 15px yellow;
        transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    .photo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .photo:hover {
        transform: scale(1.05);
        box-shadow: 0 15px 30px rgba(0,0,0,0.3);

    @media (max-width: 768px) {
        .main h1 {
            font-size: 28px;
            position: relative;
